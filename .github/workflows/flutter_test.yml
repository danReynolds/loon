name: Run Flutter Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        # flutter_lints ^6.0.0 (bumped in #30) requires Dart SDK ^3.8.0
        # for the package, and example/ depends on cupertino_icons ^1.0.9
        # which requires Dart ^3.9.0. Flutter 3.44 ships Dart 3.12 which
        # satisfies both.
        flutter-version: '3.44.0'

    - name: Install dependencies
      run: flutter pub get

    # --concurrency=1: the suite awaits broadcast propagation with a 1ms
    # Future.delayed which can race the 0ms broadcast Timer under the CPU
    # contention of parallel-isolate test runs.
    - name: Run Core tests
      run: flutter test test/core --concurrency=1

    - name: Run Native tests
      run: flutter test test/native --concurrency=1

    # Validate workload results without treating shared-runner timings as a baseline.
    - name: Check profiling workloads
      env:
        PROFILE_WARMUPS: '1'
        PROFILE_WARMUP_MS: '0'
        PROFILE_TRIALS: '1'
      run: flutter test benchmark/value_store --concurrency=1

    - name: Check manager workloads
      run: >-
        dart run benchmark/value_store/run_core.dart --suite manager_core
        --source workspace=dir:. --modes jit --passes 1 --trials 1
        --warmups 1 --warmup-ms 0 --out build/ci-manager-core

    - name: Run Web tests
      run: flutter test test/web --platform chrome --concurrency=1
